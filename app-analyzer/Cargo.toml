[package]
name = "app-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
provider = { path = "../provider" }
analyzer = { path = "../analyzer" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }